<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram - Iniciar sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Header -->
    <header>
    <img class="logo" src="logo.png" alt="Instagram">
    </header>

    <!-- Contenido principal -->
<main>

    <section class="izquierda">
        <h1>Mira los momentos cotidianos de tus <span>mejores amigos.</span></h1>

    <img src="collage.png" alt="collage" class="collage de fotos con amigos">
    </section>

    <section class="derecha">
        <h2>Iniciar sesión en Instagram</h2>

    <!-- Formulario -->
    <form>
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" placeholder="Número de celular, nombre de usuario o correo electrónico">

        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="Contraseña">

        <button type="submit" class="boton azul">Iniciar sesión</button>
    </form>

    <a href="#" class="olvido">¿Olvidaste tu contraseña?</a>

    <div class="separador">
        <hr>
        <span>O</span>
        <hr>
    </div>

    <button class="boton gris">Iniciar sesión con Facebook</button>
    <button class="boton borde">Crear cuenta nueva</button>

    <p class="meta">Meta</p>
    </section>

</main>

    <!-- Footer -->
<footer>
    <nav>
        <a href="#">Meta</a>
        <a href="#">Información</a>
        <a href="#">Blog</a>
        <a href="#">Empleo</a>
        <a href="#">Ayuda</a>
        <a href="#">API</a>
        <a href="#">Privacidad</a>
        <a href="#">Condiciones</a>
        <a href="#">Ubicaciones</a>
        <a href="#">Popular</a>
        <a href="#">Instagram Lite</a>
        <a href="#">Meta AI</a>
        <a href="#">Threads</a>
        <a href="#">Meta Verified</a>
    </nav>
    <p>Español &nbsp;&nbsp; © - 2026 Instagram from Meta</p>
</footer>
</body>
</html>
